[project]
name = "etuutt-bot"
version = "0.0.1"
readme = "README.md"
license = "MIT"
license-files = [ "LICENSE" ]
requires-python = ">=3.12"
dependencies = [
    "aiohttp~=3.14.0",
    "aiohttp-jinja2~=1.6.0",
    "discord-py[speed]~=2.7.1",
    "jinja2~=3.1.6",
    "pydantic~=2.13.4",
    "pydantic-settings~=2.15.0",
    "sentry-sdk[aiohttp]~=2.68.0",
    "tomlkit~=0.15.0",
]

[dependency-groups]
dev = [
    "prek~=0.4",
    "ruff==0.16.3",
]
docs = [
    "mkdocs-material~=9.7.6",
    "mkdocstrings-python~=2.0.3",
]

[tool.uv]
required-version = "~=0.12"
default-groups = [ "dev", "docs" ]

[tool.ruff]
line-length = 99

[tool.ruff.format]
indent-style = "space"
line-ending = "lf"
quote-style = "double"

[tool.ruff.lint]
select = [
    "A",
    "ASYNC",
    "B",
    "E",
    "ERA",
    "F",
    "I",
    "INP",
    "N",
    "PERF",
    "RET",
    "RUF",
    "SIM",
    "T20",
    "TC",
    "TID",
    "UP",
]
ignore = [ "E501" ]
flake8-tidy-imports.ban-relative-imports = "all"
