name: CI bot etu-utt
on:
    pull_request:

permissions:
    contents: read

jobs:
    ci:
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout code
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                with:
                    persist-credentials: false

            -   name: Run prek
                uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece # v3.0.0
